name: Build & Test CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'

jobs:
  build:
    name: Build Next.js App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://wbuqekmigjqnrtxwkgjx.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndidXFla21pZ2pxbnJ0eHdrZ2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTYzMzUsImV4cCI6MjEwMjA3MjMzNX0.u9ykUPExzIomFbniREYGAgTPAXvY6SJWHP2z04OVNks' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndidXFla21pZ2pxbnJ0eHdrZ2p4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjQ5NjMzNSwiZXhwIjoyMTAyMDcyMzM1fQ.FgTDLkmgC1L0N6hSVdOW70tJk-OEDNla0orRUsix8C4' }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'gcnet' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'gcnet1975' }}
